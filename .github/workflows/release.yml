name: Void Music Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: voidmusic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          printf '%s\n' "LASTFM_API_KEY=$LASTFM_API_KEY" "LASTFM_SECRET=$LASTFM_SECRET" > local.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > voidmusic-release.jks
          {
            printf 'storeFile=voidmusic-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 voidmusic-release.jks keystore.properties local.properties

      - name: Run Android unit tests
        run: ./gradlew :app:testProdDebugUnitTest

      - name: Build signed production APK
        run: ./gradlew :app:assembleProdRelease

      - name: Verify package, alignment, and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/prod/release/app-prod-universal-release.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is unavailable}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='com.voidmusic.player' versionCode='33' versionName='1.0.1' "
          "$build_tools/zipalign" -c -v 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/Void.Music.apk
          sha256sum dist/Void.Music.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Void Music ${{ github.ref_name }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/Void.Music.apk
          body: |
            ## Void Music ${{ github.ref_name }}

            First official Void Music Android release from the OPZENITSUUU/VoidMusic repository.

            - Keeps the full music-player feature set and existing app icon.
            - Adds the VoidMusic GitHub Releases updater with verified APK downloads.
            - Includes the Settings “Check for Updates” control and concise update notes.

            ## Installation and data notice

            This APK uses the new Void Music signing certificate. Android cannot install it as an in-place update over legacy beta7/beta8 builds signed with a different certificate. Back up any important local app data before deciding whether to uninstall an older build. No existing app is uninstalled or overwritten by this workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
