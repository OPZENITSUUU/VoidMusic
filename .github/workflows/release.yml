name: Void Music Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to validate, build, and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voidmusic-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag, versionCode, latest release, and duplicate status
        id: release_validation
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSHED_TAG: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_PUSHED_TAG" == "true" ]]; then
            echo "::error::A force-updated release tag cannot be published."
            exit 1
          fi

          python3 .github/scripts/validate_release.py \
            --tag "$RELEASE_TAG" \
            --gradle-file build.gradle.kts \
            --repository .

          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(-H "Accept: application/vnd.github+json" \
                   -H "Authorization: Bearer $GITHUB_TOKEN" \
                   -H "X-GitHub-Api-Version: 2022-11-28")
          release_status="$(curl -sS -o "$RUNNER_TEMP/existing-release.json" \
            -w '%{http_code}' "${headers[@]}" "$api/releases/tags/$RELEASE_TAG")"
          case "$release_status" in
            200)
              echo "::error::A GitHub Release already exists for $RELEASE_TAG; refusing to overwrite it."
              exit 1
              ;;
            404) ;;
            *)
              echo "::error::Could not confirm release uniqueness (GitHub API HTTP $release_status)."
              exit 1
              ;;
          esac

          latest_status="$(curl -sS -o "$RUNNER_TEMP/latest-release.json" \
            -w '%{http_code}' "${headers[@]}" "$api/releases/latest")"
          case "$latest_status" in
            200)
              latest_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("tag_name", ""))' "$RUNNER_TEMP/latest-release.json")"
              if [[ -z "$latest_tag" ]]; then
                echo "::error::GitHub returned a latest release without a tag."
                exit 1
              fi
              ;;
            404) latest_tag="" ;;
            *)
              echo "::error::Could not confirm latest release ordering (GitHub API HTTP $latest_status)."
              exit 1
              ;;
          esac

          version_code="$(python3 .github/scripts/validate_release.py \
            --tag "$RELEASE_TAG" \
            --gradle-file build.gradle.kts \
            --repository . \
            --latest-release-tag "$latest_tag" \
            --print-version-code)"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret is missing or empty: $name"
              exit 1
            fi
            echo "Required Actions secret is present: $name"
          done

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > voidmusic-release.jks; then
            echo "::error::KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          if [[ ! -s voidmusic-release.jks ]] || ! keytool -list -keystore voidmusic-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Decoded keystore, KEYSTORE_PASSWORD, or KEY_ALIAS is invalid"
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          printf 'signing validation\n' > "$temp_dir/payload.txt"
          jar cf "$temp_dir/unsigned.jar" -C "$temp_dir" payload.txt >/dev/null
          if ! jarsigner -keystore voidmusic-release.jks -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" -signedjar "$temp_dir/signed.jar" \
            "$temp_dir/unsigned.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock the configured signing alias"
            exit 1
          fi
          jarsigner -verify "$temp_dir/signed.jar" >/dev/null

          keytool -exportcert -alias "$KEY_ALIAS" -keystore voidmusic-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -file "$temp_dir/certificate.der" >/dev/null 2>&1
          certificate_sha256="$(sha256sum "$temp_dir/certificate.der" | awk '{print toupper($1)}')"
          expected_sha256="4D70AD0DEC72160984BCC04FAD9FC8CC433B275DCC2BBED2918282AEF7E23A6B"
          if [[ "$certificate_sha256" != "$expected_sha256" ]]; then
            echo "::error::Signing certificate fingerprint mismatch"
            exit 1
          fi
          echo "Existing release signing key verified."

          {
            printf 'storeFile=voidmusic-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 voidmusic-release.jks keystore.properties

      - name: Run Android unit tests
        run: ./gradlew :app:testProdDebugUnitTest

      - name: Build signed production APK
        run: ./gradlew :app:assembleProdRelease

      - name: Verify package, version, alignment, and signature
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EXPECTED_VERSION_CODE: ${{ steps.release_validation.outputs.version_code }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/prod/release/app-prod-universal-release.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is unavailable}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          expected_version="${RELEASE_TAG#v}"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -F "package: name='com.voidmusic.player'" <<< "$badging"
          grep -F "versionName='$expected_version'" <<< "$badging"
          grep -F "versionCode='$EXPECTED_VERSION_CODE'" <<< "$badging"
          "$build_tools/zipalign" -c -v 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/Void.Music.apk
          sha256sum dist/Void.Music.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Void Music ${{ inputs.release_tag || github.ref_name }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/Void.Music.apk
          body: |
            ## Void Music ${{ inputs.release_tag || github.ref_name }}

            Bug-fix release.

            - Pauses animated cover-art video decoding and periodic frame capture when music is paused, the app is backgrounded, or the player is transitioning, reducing unnecessary work.
            - Keeps the existing application ID and release signing certificate.

            Android can install this as an in-place update only over builds signed with the same certificate. Older beta builds signed with a different certificate cannot be updated in place.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
