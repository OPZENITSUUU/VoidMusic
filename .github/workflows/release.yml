name: Void Music Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: voidmusic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret is missing or empty: $name"
              exit 1
            fi
            echo "Required Actions secret is present: $name"
          done

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > voidmusic-release.jks; then
            echo "::error::KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          if [[ ! -s voidmusic-release.jks ]] || ! keytool -list -keystore voidmusic-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Decoded keystore, KEYSTORE_PASSWORD, or KEY_ALIAS is invalid"
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          printf 'signing validation\n' > "$temp_dir/payload.txt"
          jar cf "$temp_dir/unsigned.jar" -C "$temp_dir" payload.txt >/dev/null
          if ! jarsigner -keystore voidmusic-release.jks -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" -signedjar "$temp_dir/signed.jar" \
            "$temp_dir/unsigned.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock the configured signing alias"
            exit 1
          fi
          jarsigner -verify "$temp_dir/signed.jar" >/dev/null

          keytool -exportcert -alias "$KEY_ALIAS" -keystore voidmusic-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -file "$temp_dir/certificate.der" >/dev/null 2>&1
          certificate_sha256="$(sha256sum "$temp_dir/certificate.der" | awk '{print toupper($1)}')"
          expected_sha256="4D70AD0DEC72160984BCC04FAD9FC8CC433B275DCC2BBED2918282AEF7E23A6B"
          if [[ "$certificate_sha256" != "$expected_sha256" ]]; then
            echo "::error::Signing certificate fingerprint mismatch: $certificate_sha256"
            exit 1
          fi
          echo "Existing release signing key verified; certificate SHA-256: $certificate_sha256"

          printf '%s\n' "LASTFM_API_KEY=$LASTFM_API_KEY" "LASTFM_SECRET=$LASTFM_SECRET" > local.properties
          {
            printf 'storeFile=voidmusic-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 voidmusic-release.jks keystore.properties local.properties

      - name: Run Android unit tests
        run: ./gradlew :app:testProdDebugUnitTest

      - name: Build signed production APK
        run: ./gradlew :app:assembleProdRelease

      - name: Verify package, alignment, and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/prod/release/app-prod-universal-release.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is unavailable}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='com.voidmusic.player' versionCode='35' versionName='1.0.3' "
          "$build_tools/zipalign" -c -v 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/Void.Music.apk
          sha256sum dist/Void.Music.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Void Music ${{ github.ref_name }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/Void.Music.apk
          body: |
            ## Void Music ${{ github.ref_name }}

            Follow-up Void Music Android release from the OPZENITSUUU/VoidMusic repository.

            - Adds “Refresh Song” to re-resolve the current track and resume near its previous position.
            - Improves addon network-consent handling, URL redaction, and LastWave search-result normalization.
            - Enforces provider-aware disk caching and a low-storage guard.
            - Shows new releases at app startup with Update Now and Update Later choices; Later keeps the reminder for the next launch.
            - Keeps the existing music-player feature set and app icon.

            ## Installation and data notice

            This APK uses the same signing certificate as v1.0.1 and can update that release. Android cannot install it as an in-place update over legacy beta7/beta8 builds signed with a different certificate. Back up any important local app data before deciding what to do with an older build. No existing app is uninstalled or overwritten by this workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
