name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Verify signing secrets and configure local signing
      shell: bash
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        umask 077
        for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [[ -z "${!name:-}" ]]; then
            echo "::error::Required Actions secret is missing or empty: $name"
            exit 1
          fi
          echo "Required Actions secret is present: $name"
        done

        if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks; then
          echo "::error::KEYSTORE_BASE64 is not valid base64"
          exit 1
        fi
        if [[ ! -s bitchord-release.jks ]] || ! keytool -list -keystore bitchord-release.jks \
          -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
          echo "::error::Decoded keystore, KEYSTORE_PASSWORD, or KEY_ALIAS is invalid"
          exit 1
        fi

        temp_dir="$(mktemp -d)"
        trap 'rm -rf "$temp_dir"' EXIT
        printf 'signing validation\n' > "$temp_dir/payload.txt"
        jar cf "$temp_dir/unsigned.jar" -C "$temp_dir" payload.txt >/dev/null
        if ! jarsigner -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" -signedjar "$temp_dir/signed.jar" \
          "$temp_dir/unsigned.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
          echo "::error::KEY_PASSWORD does not unlock the configured signing alias"
          exit 1
        fi
        jarsigner -verify "$temp_dir/signed.jar" >/dev/null

        keytool -exportcert -alias "$KEY_ALIAS" -keystore bitchord-release.jks \
          -storepass "$KEYSTORE_PASSWORD" -file "$temp_dir/certificate.der" >/dev/null 2>&1
        certificate_sha256="$(sha256sum "$temp_dir/certificate.der" | awk '{print toupper($1)}')"
        expected_sha256="4D70AD0DEC72160984BCC04FAD9FC8CC433B275DCC2BBED2918282AEF7E23A6B"
        if [[ "$certificate_sha256" != "$expected_sha256" ]]; then
          echo "::error::Signing certificate fingerprint mismatch: $certificate_sha256"
          exit 1
        fi
        echo "Existing release signing key verified; certificate SHA-256: $certificate_sha256"

        printf '%s\n' "LASTFM_API_KEY=$LASTFM_API_KEY" "LASTFM_SECRET=$LASTFM_SECRET" > local.properties
        {
          printf 'storeFile=bitchord-release.jks\n'
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
          printf 'keyAlias=%s\n' "$KEY_ALIAS"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"
        } > keystore.properties
        chmod 600 bitchord-release.jks local.properties keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
